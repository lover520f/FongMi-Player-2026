<!doctype html>
<html is-chrome="true">

<head>
  <meta charset="UTF-8" />
  <title>fmplayer</title>
  <!-- CSP 由 electron.vite.config.ts 在生产构建时注入（dev 模式 Vite 依赖 inline 脚本，静态 CSP 会拦截导致白屏） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
  <button id="a11y-open-btn" tabindex="1"
    style="position: fixed; z-index: -1; left: 0px; top: 0px; width: 0px; height: 0px; opacity: 0;">开启读屏标签</button>
  <div id="a11y-live-assertive" aria-live="assertive"
    style="position: fixed; z-index: -1; left: 0px; top: 0px; width: 0px; height: 0px; opacity: 0;">读屏标签已关闭</div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
